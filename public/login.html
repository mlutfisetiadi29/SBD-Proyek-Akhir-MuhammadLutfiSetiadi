<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - FacilRent UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center h-screen">
    <div class="bg-slate-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-700">
        <h2 class="text-3xl font-bold text-white text-center mb-2">🏛️ FacilRent</h2>
        <p class="text-slate-400 text-center mb-6 text-sm">Sistem Peminjaman Laboratorium Netlab Fakultas Teknik Universitas Indonesia</p>
        
        <div id="alertBox" class="hidden p-3 mb-4 rounded-lg text-sm text-center"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Email Kampus</label>
                <input type="email" id="email" required placeholder="nama@ui.ac.id" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <div>
                <label class="block text-slate-300 text-sm font-medium mb-1">Password</label>
                <input type="password" id="password" required placeholder="••••••••" class="w-full p-3 rounded-lg bg-slate-700 border border-slate-600 text-white focus:outline-none focus:border-blue-500">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold p-3 rounded-lg transition duration-200 mt-2">
                Masuk ke Sistem
            </button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await response.json();

                if (!response.ok) {
                    alertBox.className = "p-3 mb-4 rounded-lg text-sm text-center bg-red-900/50 text-red-300 border border-red-700";
                    alertBox.innerText = result.error;
                    alertBox.classList.remove('hidden');
                } else {
                    alertBox.className = "p-3 mb-4 rounded-lg text-sm text-center bg-green-900/50 text-green-300 border border-green-700";
                    alertBox.innerText = "Login Sukses! Mengalihkan...";
                    alertBox.classList.remove('hidden');
                    
                    // Simpan token session Redis ke localStorage browser
                    localStorage.setItem('token', result.token);
                    localStorage.setItem('role', result.user.role);
                    
                    setTimeout(() => window.location.href = '/index.html', 1000);
                }
            } catch (err) {
                console.error(err);
            }
        });
    </script>
</body>
</html>
