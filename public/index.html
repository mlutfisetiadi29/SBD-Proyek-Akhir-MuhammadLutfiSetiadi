<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - FacilRent</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">
    <nav class="bg-slate-800 border-b border-slate-700 p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold text-white flex items-center gap-2">🏛️ FacilRent Dashboard</h1>
            <button onclick="logout()" class="bg-red-600 hover:bg-red-700 text-sm font-medium px-4 py-2 rounded-lg transition">
                Logout
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 h-fit shadow-lg">
            <h3 class="text-lg font-bold text-white mb-4">Ajukan Pinjaman Lab</h3>
            <form id="bookingForm" class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Pilih Laboratorium</label>
                    <select id="facilitySelect" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none"></select>
                </div>
                <div>
                    <label class="block text-sm text-slate-400 mb-1">Tanggal Pinjam</label>
                    <input type="date" id="tanggal_pinjam" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Jam Mulai</label>
                        <input type="time" id="jam_mulai" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">Jam Selesai</label>
                        <input type="time" id="jam_selesai" required class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 text-white focus:outline-none">
                    </div>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded transition mt-2">
                    Kirim Permohonan
                </button>
            </form>
        </div>

        <div class="md:col-span-2 space-y-6">
            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-lg font-bold text-white mb-3">Status Ruang Laboratorium</h3>
                <div id="facilitiesContainer" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <div class="bg-slate-800 p-6 rounded-xl border border-slate-700 shadow-lg">
                <h3 class="text-lg font-bold text-white mb-3">Riwayat Booking Anda</h3>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-700 text-slate-200 uppercase text-xs">
                            <tr>
                                <th class="p-3">Lab</th>
                                <th class="p-3">Tanggal</th>
                                <th class="p-3">Waktu</th>
                                <th class="p-3">Status</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
